<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a0b12">
<title>Convite · Marcella · 13 anos</title>
<meta property="og:title" content="Convite · Marcella · 13 anos">
<meta property="og:description" content="Entre páginas, rosas e encantos, uma nova história está prestes a começar. Abra o convite.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --ratio:941/1672;
  --wine:#5e1220;
  --wine-deep:#3a0a14;
  --navy:#1b2547;
  --gold:#c9a24b;
  --gold-light:#ecd08a;
  --parch:#f3e3bd;
  --parch-deep:#e2c88f;
  --display:'Cinzel',Georgia,serif;
  --serif:'Cormorant Garamond',Georgia,serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#2a0b12;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{font-family:var(--serif);color:var(--wine);-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button,input,select{font:inherit;color:inherit}

/* ---------- telas ---------- */
.screen{
  position:fixed;inset:0;overflow:hidden;
  opacity:0;visibility:hidden;
  transition:opacity 0s linear .8s,visibility 0s linear .8s;
}
.screen.active{opacity:1;visibility:visible;transition:opacity .8s ease,visibility 0s}
/* fundo desfocado só aparece quando a tela é mais larga que o convite (tablet / computador) */
.bg{display:none;position:absolute;inset:-6%;background-size:cover;background-position:center;filter:blur(26px) brightness(.8);transform:scale(1.08)}
@media (min-aspect-ratio:5628/10000){.bg{display:block}}
.stage{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:calc(100vh * .5628);
  width:calc(100dvh * .5628);
  aspect-ratio:var(--ratio);
}
.stage>img,.stage>video{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;user-select:none;-webkit-user-drag:none}

/* ---------- capa ---------- */
#cover{cursor:pointer}
.glow{
  position:absolute;left:54%;top:47%;width:44%;aspect-ratio:1;transform:translate(-50%,-50%);
  border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,226,150,.55) 0%,rgba(255,200,110,.18) 40%,rgba(255,200,110,0) 70%);
  animation:glow 3.4s ease-in-out infinite;
}
@keyframes glow{0%,100%{opacity:.2;transform:translate(-50%,-50%) scale(.9)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}}

/* ---------- vídeo ---------- */
#video{background:#1a060b}
.skip{
  position:fixed;z-index:40;left:50%;transform:translateX(-50%);
  bottom:calc(18px + env(safe-area-inset-bottom,0px));
  min-height:44px;padding:8px 24px;border-radius:999px;
  border:1px solid rgba(236,208,138,.7);background:rgba(42,11,18,.55);
  color:var(--gold-light);font-family:var(--display);font-weight:500;font-size:14px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;
  opacity:0;transition:opacity .6s ease;
}
.skip.show{opacity:.9}
.skip:focus-visible{outline:3px solid var(--gold-light);outline-offset:2px}

/* ---------- botões sobre a imagem ---------- */
.hot{
  position:absolute;left:var(--x);top:var(--y);width:15.5%;aspect-ratio:1;
  transform:translate(-50%,-50%);border-radius:50%;border:0;padding:0;margin:0;
  background:transparent;cursor:pointer;display:block;text-decoration:none;
}
.hot:active{background:rgba(201,162,75,.25)}
.hot:focus-visible{outline:3px solid var(--wine);outline-offset:3px}

/* ---------- botão delicado (voltar) ---------- */
.pill{
  position:absolute;left:50%;transform:translateX(-50%);
  display:inline-flex;align-items:center;justify-content:center;gap:.7em;
  min-height:38px;padding:4px 22px;
  border-radius:999px;border:1px solid rgba(201,162,75,.95);
  background:linear-gradient(180deg,rgba(250,236,200,.94),rgba(226,200,143,.9));
  box-shadow:0 4px 14px rgba(40,8,14,.4),inset 0 1px 0 rgba(255,255,255,.7);
  color:var(--wine);font-family:var(--display);font-weight:500;font-size:13px;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;cursor:pointer;
}
.pill i{font-style:normal;font-size:.8em;opacity:.7}
.pill:active{transform:translateX(-50%) scale(.97)}
.pill:focus-visible{outline:2px solid var(--wine);outline-offset:3px}
#gifts .pill{top:95%}

/* ---------- música ---------- */
.music{
  position:fixed;z-index:30;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));
  width:44px;height:44px;border-radius:50%;padding:0;cursor:pointer;
  border:1.5px solid var(--gold);
  background:linear-gradient(180deg,rgba(250,236,200,.95),rgba(226,200,143,.92));
  box-shadow:0 4px 14px rgba(30,6,10,.5);color:var(--wine);
  display:grid;place-items:center;
}
.music svg{width:21px;height:21px;display:block}
.music .off{display:none}
.music[aria-pressed="false"] .on{display:none}
.music[aria-pressed="false"] .off{display:block}
.music:focus-visible{outline:3px solid var(--gold-light);outline-offset:2px}

/* ---------- páginas de confirmação e localização ---------- */
.stage{container-type:inline-size}
.ttl{
  position:absolute;left:27%;right:27%;top:16.1%;height:6.8%;
  display:grid;place-items:center;text-align:center;
  font-family:var(--display);font-weight:700;font-size:3.1cqw;line-height:1.08;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;
  color:var(--wine);text-shadow:0 1px 0 rgba(255,244,214,.7);
}
.panel{
  position:absolute;left:19%;right:19%;top:27.5%;bottom:20%;
  display:flex;flex-direction:column;justify-content:center;gap:3.4cqw;
  color:var(--wine);text-align:center;
}
.panel[hidden]{display:none}
.panel .lb{
  display:block;margin:0 0 1.2cqw;font-family:var(--display);font-weight:700;font-size:2.7cqw;letter-spacing:.16em;text-transform:uppercase;color:var(--wine);text-align:left;
}
.panel input[type=text]{
  width:100%;min-height:11cqw;padding:1cqw 3.4cqw;border-radius:2.4cqw;
  border:1.5px solid #b48a3c;background:rgba(255,248,230,.55);
  font-family:var(--serif);font-size:5cqw;font-weight:700;color:var(--wine);
  box-shadow:inset 0 1px 3px rgba(94,18,32,.18);
}
.panel input[type=text]::placeholder{color:rgba(94,18,32,.45);font-weight:600}
.panel input[type=text]:focus{outline:2px solid rgba(94,18,32,.55);outline-offset:1px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:2.4cqw}
.choice{position:relative}
.choice input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.choice span{
  display:flex;align-items:center;justify-content:center;text-align:center;min-height:11cqw;padding:1cqw 1.6cqw;border-radius:2.4cqw;
  border:1.5px solid #b48a3c;background:rgba(255,248,230,.45);
  font-family:var(--serif);font-size:4.1cqw;font-weight:700;line-height:1.05;white-space:nowrap;
}
.choice input:checked+span{background:linear-gradient(180deg,#7d1b2e,var(--wine-deep));color:var(--gold-light);border-color:var(--gold)}
.choice input:focus-visible+span{outline:2px solid rgba(94,18,32,.7);outline-offset:2px}
.stepper{display:flex;align-items:center;justify-content:center;gap:5cqw}
.stepper button{
  width:11cqw;height:11cqw;border-radius:50%;border:1.5px solid #b48a3c;background:rgba(255,248,230,.55);
  font-size:6.4cqw;line-height:1;font-weight:700;color:var(--wine);cursor:pointer;padding:0;
}
.stepper output{min-width:12cqw;text-align:center;font-family:var(--display);font-size:7cqw;font-weight:700}
.stepper button:focus-visible{outline:2px solid rgba(94,18,32,.7);outline-offset:2px}
.err{margin:0;color:#9b1c2e;font-size:4cqw;font-weight:700}
.acts{display:grid;gap:2.4cqw;margin-top:1cqw}
.btn{
  display:flex;align-items:center;justify-content:center;min-height:11.5cqw;padding:1cqw 5cqw;border-radius:999px;
  font-family:var(--display);font-weight:700;font-size:3.2cqw;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;cursor:pointer;
}
.btn.primary{border:1px solid var(--gold);color:var(--gold-light);background:linear-gradient(180deg,#7d1b2e,var(--wine-deep));box-shadow:0 .8cqw 2cqw rgba(60,8,18,.35)}
.btn.ghost{border:1.5px solid #b48a3c;background:transparent;color:var(--wine)}
.btn:focus-visible{outline:2px solid var(--wine);outline-offset:2px}
.orn{color:#b48a3c;font-size:4.4cqw;letter-spacing:.6em;text-indent:.6em}
.big{font-family:var(--display);font-weight:700;font-size:6.6cqw;line-height:1.15;letter-spacing:.05em;text-transform:uppercase}
.soft{font-family:var(--serif);font-size:5.4cqw;font-weight:700;line-height:1.25;margin:0}
.soft.it{font-style:italic;font-weight:600}
.rule{height:1px;width:60%;margin:0 auto;background:linear-gradient(90deg,transparent,#b48a3c,transparent)}

.screen:not(.active) *,.screen:not(.active) *::after{animation-play-state:paused!important}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
  .hot::after{opacity:0}
}
</style>
</head>
<body>

<!-- 1 · capa -->
<section class="screen active" id="cover" role="button" tabindex="0" aria-label="Clique para abrir o convite">
  <div class="bg" style="background-image:url(assets/capa.jpg)"></div>
  <div class="stage">
    <img src="assets/capa.jpg" alt="Livro encantado com uma rosa sob a redoma de vidro. Clique para abrir." width="941" height="1672" decoding="async" fetchpriority="high">
    <span class="glow" aria-hidden="true"></span>
  </div>
</section>

<!-- 2 · vídeo de abertura -->
<section class="screen" id="video" aria-hidden="true">
  <div class="bg" style="background-image:url(assets/capa.jpg)"></div>
  <div class="stage">
    <video id="vid" src="assets/abertura.mp4" poster="assets/capa.jpg" muted playsinline webkit-playsinline preload="auto"></video>
  </div>
  <button class="skip" id="skip" type="button">Pular</button>
</section>

<!-- 3 · informações -->
<section class="screen" id="info" aria-hidden="true">
  <div class="bg" style="background-image:url(assets/informacoes.jpg)"></div>
  <div class="stage">
    <img src="assets/informacoes.jpg" alt="Convite de Marcella, 13 anos. 18 de dezembro, às 18 horas. Toque nos ícones: confirmar presença, localização ou dicas de presentes." width="1080" height="1920" decoding="async">
    <button class="hot" id="btn-confirm" type="button" style="--x:42.8%;--y:66.6%;--d:0s" aria-label="Confirmar presença"></button>
    <button class="hot" id="btn-map" type="button" style="--x:58.8%;--y:66.2%;--d:.5s" aria-label="Localização: Palácio das Festas"></button>
    <button class="hot" id="btn-gifts" type="button" style="--x:74.8%;--y:66.7%;--d:1s" aria-label="Dicas de presentes"></button>
  </div>
</section>

<!-- 4 · presentes -->
<section class="screen" id="gifts" aria-hidden="true">
  <div class="bg" style="background-image:url(assets/presentes.jpg)"></div>
  <div class="stage">
    <img src="assets/presentes.jpg" alt="Dicas de presentes: livros de contos, perfumes suaves, body splash da Wepink, maquiagens Boca Rosa, roupas tamanho 14 ou P, calçados 36 e acessórios." width="941" height="1672" decoding="async">
    <button class="pill" id="btn-back" type="button"><i>✦</i>Voltar<i>✦</i></button>
  </div>
</section>

<!-- 5 · confirmar presença -->
<section class="screen" id="rsvp" aria-hidden="true">
  <div class="bg" style="background-image:url(assets/formulario.jpg)"></div>
  <div class="stage">
    <img src="assets/formulario.jpg" alt="" width="941" height="1672" decoding="async">
    <h2 class="ttl" id="rsvp-ttl">Confirmar presença</h2>
    <div class="panel" id="rsvp-form-wrap">
      <form id="rsvp-form" novalidate style="display:contents">
        <div>
          <label class="lb" for="rsvp-nome">Seu nome</label>
          <input type="text" id="rsvp-nome" name="nome" placeholder="Nome e sobrenome" autocomplete="name" maxlength="60">
        </div>
        <div>
          <span class="lb" id="lg-resp">Você vai?</span>
          <div class="choices" role="radiogroup" aria-labelledby="lg-resp">
            <label class="choice"><input type="radio" name="resp" value="sim" checked><span>Sim, eu vou!</span></label>
            <label class="choice"><input type="radio" name="resp" value="nao"><span>Não poderei ir</span></label>
          </div>
        </div>
        <div id="qtd-wrap">
          <span class="lb" id="lg-qtd">Quantas pessoas, com você?</span>
          <div class="stepper" role="group" aria-labelledby="lg-qtd">
            <button type="button" id="qtd-minus" aria-label="Diminuir">−</button>
            <output id="qtd" aria-live="polite">1</output>
            <button type="button" id="qtd-plus" aria-label="Aumentar">+</button>
          </div>
        </div>
        <p class="err" id="rsvp-err" role="alert" hidden>Escreva seu nome para continuar.</p>
        <div class="acts">
          <button class="btn primary" type="submit">Enviar confirmação</button>
          <button class="btn ghost" type="button" data-back>Voltar</button>
        </div>
      </form>
    </div>
    <div class="panel" id="rsvp-thanks" hidden>
      <span class="orn" aria-hidden="true">✦ ✦ ✦</span>
      <div class="big" id="thanks-title">Que alegria!</div>
      <div class="rule"></div>
      <p class="soft" id="thanks-text"></p>
      <div class="acts">
        <a class="btn primary" id="thanks-wa" target="_blank" rel="noopener noreferrer" href="#" hidden>Avisar no WhatsApp</a>
        <button class="btn ghost" type="button" data-back>Voltar ao convite</button>
      </div>
    </div>
  </div>
</section>

<!-- 6 · localização -->
<section class="screen" id="map" aria-hidden="true">
  <div class="bg" style="background-image:url(assets/formulario.jpg)"></div>
  <div class="stage">
    <img src="assets/formulario.jpg" alt="" width="941" height="1672" decoding="async">
    <h2 class="ttl">Localização</h2>
    <div class="panel">
      <span class="orn" aria-hidden="true">✦ ✦ ✦</span>
      <div class="soft it">O festejo será no</div>
      <div class="big" id="map-place">Palácio das Festas</div>
      <p class="soft" id="map-addr" hidden></p>
      <div class="rule"></div>
      <p class="soft it" id="map-when">18 de dezembro · às 18h</p>
      <div class="acts">
        <a class="btn primary" id="map-open" target="_blank" rel="noopener noreferrer" href="#">Abrir no mapa</a>
        <button class="btn ghost" type="button" data-back>Voltar</button>
      </div>
    </div>
  </div>
</section>

<!-- música -->
<button class="music" id="music" type="button" aria-pressed="true" aria-label="Pausar música" hidden>
  <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3" fill="currentColor"/><circle cx="17" cy="16" r="3" fill="currentColor"/></svg>
  <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3" fill="currentColor"/><circle cx="17" cy="16" r="3" fill="currentColor"/><path d="M3 3l18 18"/></svg>
</button>
<audio id="audio" src="assets/musica.m4a" loop preload="auto"></audio>

<script>
(function(){
  /* ====== dados do convite (edite aqui) ====== */
  var CONFIG={
    nome:'Marcella',
    local:'Palácio das Festas',
    endereco:'',          /* ex.: 'Rua Tal, 123 - Bairro, Cidade' (ajuda o mapa a achar o lugar certo) */
    data:'18 de dezembro',
    hora:'18h',
    whatsapp:''           /* ex.: '5585999999999'. Se preencher, depois da confirmação aparece o botão "Avisar no WhatsApp" */
  };

  var $=function(s){return document.querySelector(s)};
  var screens={cover:$('#cover'),video:$('#video'),info:$('#info'),gifts:$('#gifts'),rsvp:$('#rsvp'),map:$('#map')};
  var vid=$('#vid'),audio=$('#audio'),musicBtn=$('#music'),skip=$('#skip');
  var current='cover',started=false,wantMusic=false,lastFocus=null;

  /* troca de tela */
  function go(name){
    current=name;
    Object.keys(screens).forEach(function(k){
      var el=screens[k],on=k===name;
      el.classList.toggle('active',on);
      el.style.zIndex=on?10:5;
      el.setAttribute('aria-hidden',on?'false':'true');
      if('inert' in el) el.inert=!on;
    });
  }
  go('cover');

  /* pré-carrega as próximas telas */
  ['assets/informacoes.jpg','assets/presentes.jpg','assets/formulario.jpg'].forEach(function(src){var i=new Image();i.src=src});

  /* ====== música (continua tocando durante todo o convite) ====== */
  function setMusicUI(playing){
    musicBtn.setAttribute('aria-pressed',playing?'true':'false');
    musicBtn.setAttribute('aria-label',playing?'Pausar música':'Tocar música');
  }
  function playMusic(){
    wantMusic=true;
    var p=audio.play();
    if(p&&p.then){p.then(function(){setMusicUI(true)},function(){setMusicUI(false)})}else{setMusicUI(!audio.paused)}
  }
  musicBtn.addEventListener('click',function(){
    if(!audio.paused){wantMusic=false;audio.pause();setMusicUI(false)}else{playMusic()}
  });
  document.addEventListener('visibilitychange',function(){
    if(!document.hidden&&wantMusic&&audio.paused&&started){playMusic()}
  });
  /* suaviza a emenda quando a música recomeça */
  var canFade=false;
  try{audio.volume=.5;canFade=audio.volume===.5;audio.volume=1}catch(e){}
  if(canFade){
    var faded=false,lastV=1;
    setInterval(function(){
      var d=audio.duration,t=audio.currentTime;
      if(!d||!isFinite(d)||audio.paused)return;
      var v=1;
      if(d-t<1.2){v=Math.max(0,(d-t)/1.2);faded=true}
      else if(faded&&t<1.2){v=Math.min(1,t/1.2)}
      if(Math.abs(v-lastV)>.02){audio.volume=v;lastV=v}
    },100);
  }

  /* ====== fluxo ====== */
  function toInfo(){
    if(current==='video'){
      go('info');vid.pause();
      skip.classList.remove('show');skip.hidden=true;
      setTimeout(function(){try{vid.removeAttribute('src');vid.removeAttribute('poster');vid.load()}catch(e){}},1500);
    }
  }
  function start(){
    if(started)return;
    started=true;
    go('video');
    musicBtn.hidden=false;
    playMusic();
    try{vid.currentTime=0}catch(e){}
    var p=vid.play();
    if(p&&p.catch){p.catch(toInfo)}
    setTimeout(function(){if(current==='video')skip.classList.add('show')},1500);
    setTimeout(function(){if(current==='video'&&vid.currentTime<.1)toInfo()},7000);
  }
  screens.cover.addEventListener('click',start);
  screens.cover.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();start()}});
  vid.addEventListener('ended',toInfo);
  vid.addEventListener('error',toInfo);
  skip.addEventListener('click',toInfo);

  $('#btn-gifts').addEventListener('click',function(){go('gifts')});
  $('#btn-back').addEventListener('click',function(){go('info')});

  /* botões "Voltar" das páginas de confirmação e localização */
  document.querySelectorAll('[data-back]').forEach(function(b){b.addEventListener('click',function(){go('info')})});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&(current==='rsvp'||current==='map'||current==='gifts'))go('info')});

  /* ====== localização ====== */
  var q=CONFIG.local+(CONFIG.endereco?', '+CONFIG.endereco:'');
  $('#map-open').href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
  $('#map-place').textContent=CONFIG.local;
  if(CONFIG.endereco){var a=$('#map-addr');a.textContent=CONFIG.endereco;a.hidden=false}
  $('#btn-map').addEventListener('click',function(){go('map')});
  $('#map-when').textContent=CONFIG.data+' · às '+CONFIG.hora;

  /* ====== confirmar presença (RSVP dentro do convite) ====== */
  var form=$('#rsvp-form'),nome=$('#rsvp-nome'),err=$('#rsvp-err');
  var qtdEl=$('#qtd'),qtdWrap=$('#qtd-wrap'),qtd=1;
  function setQtd(n){qtd=Math.max(1,Math.min(10,n));qtdEl.textContent=qtd}
  $('#qtd-minus').addEventListener('click',function(){setQtd(qtd-1)});
  $('#qtd-plus').addEventListener('click',function(){setQtd(qtd+1)});
  function resp(){return form.querySelector('input[name=resp]:checked').value}
  form.querySelectorAll('input[name=resp]').forEach(function(r){
    r.addEventListener('change',function(){qtdWrap.hidden=resp()==='nao'});
  });
  nome.addEventListener('input',function(){err.hidden=true});

  $('#btn-confirm').addEventListener('click',function(){
    $('#rsvp-thanks').hidden=true;$('#rsvp-form-wrap').hidden=false;$('#rsvp-ttl').textContent='Confirmar presença';err.hidden=true;
    go('rsvp');
  });

  form.addEventListener('submit',function(e){
    e.preventDefault();
    var n=nome.value.replace(/\s+/g,' ').trim();
    if(n.length<2){err.hidden=false;nome.focus();return}
    var vai=resp()==='sim';
    var first=n.split(' ')[0];
    var msg,titulo,texto;
    if(vai){
      titulo='Que alegria, '+first+'!';
      texto='Presença confirmada para '+qtd+(qtd===1?' pessoa':' pessoas')+'. Esperamos você em '+CONFIG.data+', às '+CONFIG.hora+', no '+CONFIG.local+'.';
      msg='Olá! Confirmo presença no aniversário de 13 anos da '+CONFIG.nome+' ('+CONFIG.data+', às '+CONFIG.hora+', '+CONFIG.local+'). Nome: '+n+'. Pessoas: '+qtd+'.';
    }else{
      titulo='Obrigada por avisar, '+first+'!';
      texto='Sentiremos a sua falta. Seu recado foi registrado com carinho.';
      msg='Olá! Infelizmente não poderei ir ao aniversário de 13 anos da '+CONFIG.nome+'. Nome: '+n+'.';
    }
    $('#thanks-title').textContent=titulo;
    $('#thanks-text').textContent=texto;
    var wa=$('#thanks-wa');
    if(CONFIG.whatsapp){wa.href='https://wa.me/'+CONFIG.whatsapp+'?text='+encodeURIComponent(msg);wa.hidden=false}else{wa.hidden=true}
    $('#rsvp-form-wrap').hidden=true;$('#rsvp-thanks').hidden=false;$('#rsvp-ttl').textContent='Obrigada!';
  });
})();
</script>
</body>
</html>
